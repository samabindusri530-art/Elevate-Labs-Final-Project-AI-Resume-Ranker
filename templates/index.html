<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>AI Resume Ranker</title>
    <link rel="stylesheet" href="{{ url_for('static', filename='style.css') }}">
</head>
<body>

    <div class="container">
        <h1>🤖 AI-Powered Resume Ranker</h1>
        <p class="subtitle">Upload resumes and find the best matches for your job description.</p>

        {% if error %}
            <p class="error">{{ error }}</p>
        {% endif %}

        <form method="POST" enctype="multipart/form-data">

            <label>Job Description</label>
            <textarea name="job_description" rows="7"
                placeholder="Enter job description and required skills..." required></textarea>

            <label>Upload PDF Resumes</label>
            <input type="file" name="resumes" accept=".pdf" multiple required>

            <button type="submit">Rank Resumes 🚀</button>

        </form>
    </div>

</body>
</html>
