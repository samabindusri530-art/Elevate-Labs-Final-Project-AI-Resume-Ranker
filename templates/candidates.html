{% extends "base.html" %}

{% block title %}Candidates - AI ATS{% endblock %}

{% block content %}

<div class="container">

    <h1>👥 Candidate Management</h1>

    <p class="subtitle">View all uploaded candidates.</p>

    <table>
        <tr>
            <th>Rank</th>
            <th>Resume</th>
            <th>Score</th>
        </tr>

        {% for result in results %}
        <tr>
            <td>{{ result.rank }}</td>
            <td>{{ result.filename }}</td>
            <td>{{ result.score }}%</td>
        </tr>
        {% endfor %}
    </table>

</div>

{% endblock %}
